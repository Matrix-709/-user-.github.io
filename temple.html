<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Endless Runner</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #87CEEB; /* Sky blue */
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        canvas {
            display: block;
        }
        #ui {
            position: absolute;
            top: 20px;
            left: 20px;
            color: white;
            font-size: 24px;
            font-weight: bold;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
            z-index: 10;
        }
        #game-over {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.8);
            color: white;
            padding: 40px;
            border-radius: 15px;
            text-align: center;
            display: none;
            z-index: 20;
        }
        button {
            margin-top: 20px;
            padding: 10px 20px;
            font-size: 18px;
            background: #4CAF50;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        button:hover { background: #45a049; }
    </style>
    <!-- Include Three.js for 3D Graphics -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <div id="ui">Score: <span id="score">0</span></div>
    
    <div id="game-over">
        <h1>Game Over!</h1>
        <p>Final Score: <span id="final-score">0</span></p>
        <button onclick="resetGame()">Try Again</button>
    </div>

    <script>
        // --- 1. Basic Setup ---
        const scene = new THREE.Scene();
        scene.fog = new THREE.Fog(0x87CEEB, 10, 50); // Adds fog to hide spawning obstacles

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 5, 10);
        camera.lookAt(0, 0, -10);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        document.body.appendChild(renderer.domElement);

        // --- 2. Lighting ---
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);
        
        const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
        dirLight.position.set(10, 20, 10);
        dirLight.castShadow = true;
        scene.add(dirLight);

        // --- 3. Environment & Player ---
        // Ground
        const groundGeo = new THREE.PlaneGeometry(30, 200);
        const groundMat = new THREE.MeshStandardMaterial({ color: 0x228B22 });
        const ground = new THREE.Mesh(groundGeo, groundMat);
        ground.rotation.x = -Math.PI / 2;
        ground.receiveShadow = true;
        scene.add(ground);

        // Player (A Blue Cube)
        const playerGeo = new THREE.BoxGeometry(1, 2, 1);
        const playerMat = new THREE.MeshStandardMaterial({ color: 0x0000ff });
        const player = new THREE.Mesh(playerGeo, playerMat);
        player.position.y = 1;
        player.castShadow = true;
        scene.add(player);

        // --- 4. Game Variables ---
        let gameActive = true;
        let score = 0;
        let gameSpeed = 0.3;
        const obstacles = [];
        const laneWidth = 3;
        let currentLane = 0; // -1 (Left), 0 (Middle), 1 (Right)
        
        // Jump Variables
        let isJumping = false;
        let yVelocity = 0;
        const gravity = -0.015;
        const jumpStrength = 0.35;

        // --- 5. Controls ---
        document.addEventListener('keydown', (e) => {
            if (!gameActive) return;
            if (e.key === 'ArrowLeft' && currentLane > -1) currentLane--;
            if (e.key === 'ArrowRight' && currentLane < 1) currentLane++;
            if (e.key === 'ArrowUp' && !isJumping) {
                isJumping = true;
                yVelocity = jumpStrength;
            }
        });

        // --- 6. Obstacle Generation ---
        function spawnObstacle() {
            if (!gameActive) return;

            const obsGeo = new THREE.BoxGeometry(2, 2, 2);
            const obsMat = new THREE.MeshStandardMaterial({ color: 0xff0000 });
            const obstacle = new THREE.Mesh(obsGeo, obsMat);
            
            // Random Lane (-1, 0, or 1)
            const lane = Math.floor(Math.random() * 3) - 1;
            obstacle.position.set(lane * laneWidth, 1, -50);
            obstacle.castShadow = true;
            
            scene.add(obstacle);
            obstacles.push(obstacle);

            // Spawn next obstacle randomly between 500ms and 1500ms
            setTimeout(spawnObstacle, Math.random() * 1000 + 500);
        }

        // --- 7. Game Loop ---
        function animate() {
            requestAnimationFrame(animate);

            if (!gameActive) return;

            // Smoothly move player horizontally to target lane
            const targetX = currentLane * laneWidth;
            player.position.x += (targetX - player.position.x) * 0.1;

            // Handle Jumping Physics
            if (isJumping) {
                player.position.y += yVelocity;
                yVelocity += gravity;
                // Hit the ground
                if (player.position.y <= 1) {
                    player.position.y = 1;
                    isJumping = false;
                    yVelocity = 0;
                }
            }

            // Move Obstacles & Check Collisions
            const playerBox = new THREE.Box3().setFromObject(player);

            for (let i = obstacles.length - 1; i >= 0; i--) {
                const obs = obstacles[i];
                obs.position.z += gameSpeed; // Move towards camera

                // Collision Check
                const obsBox = new THREE.Box3().setFromObject(obs);
                // Shrink collision box slightly to make the game feel fairer
                obsBox.expandByScalar(-0.2); 

                if (playerBox.intersectsBox(obsBox)) {
                    gameOver();
                }

                // Remove obstacles that have passed the camera
                if (obs.position.z > 10) {
                    scene.remove(obs);
                    obstacles.splice(i, 1);
                    score += 10;
                    document.getElementById('score').innerText = score;
                    gameSpeed += 0.002; // Slowly increase speed over time
                }
            }

            renderer.render(scene, camera);
        }

        // --- 8. Game States ---
        function gameOver() {
            gameActive = false;
            document.getElementById('game-over').style.display = 'block';
            document.getElementById('final-score').innerText = score;
        }

        function resetGame() {
            // Remove all current obstacles
            obstacles.forEach(obs => scene.remove(obs));
            obstacles.length = 0;
            
            // Reset variables
            score = 0;
            gameSpeed = 0.3;
            currentLane = 0;
            player.position.set(0, 1, 0);
            document.getElementById('score').innerText = score;
            document.getElementById('game-over').style.display = 'none';
            
            gameActive = true;
            spawnObstacle();
        }

        // Handle window resize
        window.addEventListener('resize', () => {
            renderer.setSize(window.innerWidth, window.innerHeight);
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
        });

        // Start Game
        spawnObstacle();
        animate();
    </script>
</body>
</html>
